<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Repos — Keith Hinds</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
      background: #ffffff;
      color: #1f2328;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Nav bar ── */
    .navbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.75rem 2rem;
      border-bottom: 1px solid #e5e7eb;
      position: relative;
    }

    .navbar .site-name {
      font-weight: 600;
      font-size: 0.95rem;
      color: #1f2328;
      text-decoration: none;
    }

    .hamburger {
      background: none;
      border: 1px solid #e5e7eb;
      border-radius: 5px;
      cursor: pointer;
      padding: 0.4rem 0.5rem;
      display: flex;
      flex-direction: column;
      gap: 4px;
      z-index: 200;
    }

    .hamburger span {
      display: block;
      width: 20px;
      height: 2px;
      background: #1f2328;
      border-radius: 2px;
      transition: transform 0.2s, opacity 0.2s;
    }

    .hamburger.open span:nth-child(1) { transform: translateY(6px) rotate(45deg); }
    .hamburger.open span:nth-child(2) { opacity: 0; }
    .hamburger.open span:nth-child(3) { transform: translateY(-6px) rotate(-45deg); }

    .nav-menu {
      display: none;
      position: absolute;
      top: calc(100% + 4px);
      right: 2rem;
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
      min-width: 180px;
      z-index: 100;
      overflow: hidden;
    }

    .nav-menu.open { display: block; }

    .nav-menu a {
      display: block;
      padding: 0.75rem 1.25rem;
      font-size: 0.9rem;
      color: #1f2328;
      text-decoration: none;
      border-bottom: 1px solid #f0f1f3;
      transition: background 0.12s;
    }

    .nav-menu a:last-child { border-bottom: none; }
    .nav-menu a:hover { background: #f7f8fa; }
    .nav-menu a.active { font-weight: 600; }

    /* ── Page header ── */
    .page-header {
      padding: 3rem 2rem 0;
      display: flex;
      justify-content: center;
    }

    .page-header-inner {
      max-width: 760px;
      width: 100%;
      border-bottom: 1px solid #e5e7eb;
      padding-bottom: 2rem;
    }

    .page-header-inner h1 {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 0.4rem;
    }

    .page-header-inner p {
      font-size: 0.9rem;
      color: #57606a;
      line-height: 1.7;
    }

    /* ── Main ── */
    main {
      flex: 1;
      display: flex;
      justify-content: center;
      padding: 2.5rem 2rem 3rem;
    }

    .content {
      max-width: 760px;
      width: 100%;
    }

    /* ── Filter bar ── */
    .filter-bar {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }

    .filter-bar input {
      flex: 1;
      min-width: 180px;
      padding: 0.45rem 0.85rem;
      border: 1px solid #e5e7eb;
      border-radius: 6px;
      font-size: 0.875rem;
      color: #1f2328;
      outline: none;
      transition: border-color 0.15s;
    }

    .filter-bar input:focus { border-color: #1f2328; }

    .filter-bar select {
      padding: 0.45rem 0.75rem;
      border: 1px solid #e5e7eb;
      border-radius: 6px;
      font-size: 0.875rem;
      color: #1f2328;
      background: #fff;
      outline: none;
      cursor: pointer;
      transition: border-color 0.15s;
    }

    .filter-bar select:focus { border-color: #1f2328; }

    .repo-count {
      font-size: 0.8rem;
      color: #57606a;
      white-space: nowrap;
    }

    /* ── Repo cards ── */
    #repo-list {
      display: flex;
      flex-direction: column;
    }

    .repo-card {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 1rem;
      padding: 1.1rem 0;
      border-bottom: 1px solid #f0f1f3;
    }

    .repo-card:last-child { border-bottom: none; }

    .repo-info { flex: 1; min-width: 0; }

    .repo-name {
      font-size: 0.95rem;
      font-weight: 600;
      color: #3b82d4;
      text-decoration: none;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: block;
      margin-bottom: 0.2rem;
    }

    .repo-name:hover { text-decoration: underline; }

    .repo-desc {
      font-size: 0.875rem;
      color: #57606a;
      line-height: 1.55;
      margin-bottom: 0.5rem;
    }

    .repo-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: center;
    }

    .repo-lang {
      display: flex;
      align-items: center;
      gap: 0.3rem;
      font-size: 0.8rem;
      color: #57606a;
    }

    .lang-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
      background: #e5e7eb;
    }

    .repo-stars, .repo-forks {
      display: flex;
      align-items: center;
      gap: 0.3rem;
      font-size: 0.8rem;
      color: #57606a;
    }

    .repo-updated {
      font-size: 0.78rem;
      color: #57606a;
    }

    .repo-fork-badge {
      font-size: 0.72rem;
      padding: 0.1rem 0.45rem;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      color: #57606a;
    }

    /* ── State messages ── */
    .state-msg {
      font-size: 0.9rem;
      color: #57606a;
      padding: 2rem 0;
      text-align: center;
    }

    /* ── Footer ── */
    footer {
      border-top: 1px solid #e5e7eb;
      padding: 1.25rem 2rem;
      text-align: center;
      font-size: 0.8rem;
      color: #57606a;
    }

    @media (max-width: 560px) {
      .repo-card { flex-direction: column; gap: 0.5rem; }
    }
  </style>
</head>
<body>

  <nav class="navbar">
    <a href="/" class="site-name">Keith Hinds</a>
    <button class="hamburger" id="menuBtn" aria-label="Open navigation menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
    <div class="nav-menu" id="navMenu">
      <a href="/">Home</a>
      <a href="/portfolio">Portfolio</a>
      <a href="/repos" class="active">Repos</a>
      <a href="/blog">Blog</a>
      <a href="/contact">Contact</a>
    </div>
  </nav>

  <div class="page-header">
    <div class="page-header-inner">
      <h1>GitHub Repos</h1>
      <p>All public repositories from <a href="https://github.com/khinds-dev" target="_blank" rel="noopener" style="color:#3b82d4;text-decoration:none;">khinds-dev</a> on GitHub.</p>
    </div>
  </div>

  <main>
    <div class="content">

      <div class="filter-bar">
        <input type="search" id="searchInput" placeholder="Search repositories…" aria-label="Search repositories" />
        <select id="sortSelect" aria-label="Sort repositories">
          <option value="updated">Recently updated</option>
          <option value="stars">Most stars</option>
          <option value="name">Name (A–Z)</option>
        </select>
        <span class="repo-count" id="repoCount"></span>
      </div>

      <div id="repo-list">
        <p class="state-msg" id="stateMsg">Loading repositories…</p>
      </div>

    </div>
  </main>

  <footer>
    &copy; <span id="yr"></span> Keith Hinds
    <script>document.getElementById('yr').textContent = new Date().getFullYear();</script>
  </footer>

  <script>
    /* ── Nav hamburger ── */
    const btn = document.getElementById('menuBtn');
    const menu = document.getElementById('navMenu');
    btn.addEventListener('click', function () {
      const isOpen = menu.classList.toggle('open');
      btn.classList.toggle('open', isOpen);
      btn.setAttribute('aria-expanded', isOpen);
    });
    document.addEventListener('click', function (e) {
      if (!btn.contains(e.target) && !menu.contains(e.target)) {
        menu.classList.remove('open');
        btn.classList.remove('open');
        btn.setAttribute('aria-expanded', false);
      }
    });

    /* ── GitHub language colours (common subset) ── */
    const LANG_COLORS = {
      JavaScript: '#f1e05a', TypeScript: '#3178c6', Python: '#3572A5',
      Java: '#b07219', 'C#': '#178600', 'C++': '#f34b7d', C: '#555555',
      HTML: '#e34c26', CSS: '#563d7c', Shell: '#89e051', Go: '#00ADD8',
      Rust: '#dea584', Ruby: '#701516', PHP: '#4F5D95', Kotlin: '#A97BFF',
      Swift: '#F05138', Dockerfile: '#384d54'
    };

    function langDot(lang) {
      const color = lang && LANG_COLORS[lang] ? LANG_COLORS[lang] : '#e5e7eb';
      return `<span class="lang-dot" style="background:${color}"></span>`;
    }

    function relativeTime(dateStr) {
      const diff = Date.now() - new Date(dateStr).getTime();
      const days = Math.floor(diff / 86400000);
      if (days < 1)  return 'today';
      if (days < 7)  return `${days}d ago`;
      if (days < 30) return `${Math.floor(days / 7)}w ago`;
      if (days < 365) return `${Math.floor(days / 30)}mo ago`;
      return `${Math.floor(days / 365)}y ago`;
    }

    function renderCard(repo) {
      const desc = repo.description
        ? `<p class="repo-desc">${repo.description}</p>`
        : '';
      const lang = repo.language
        ? `<span class="repo-lang">${langDot(repo.language)}${repo.language}</span>`
        : '';
      const stars = repo.stargazers_count > 0
        ? `<span class="repo-stars">
             <svg width="13" height="13" viewBox="0 0 16 16" fill="#57606a">
               <path d="M8 .25a.75.75 0 0 1 .673.418l1.882 3.815 4.21.612a.75.75 0 0 1 .416 1.279l-3.046 2.97.719 4.192a.751.751 0 0 1-1.088.791L8 12.347l-3.766 1.98a.75.75 0 0 1-1.088-.79l.72-4.194L.818 6.374a.75.75 0 0 1 .416-1.28l4.21-.611L7.327.668A.75.75 0 0 1 8 .25Z"/>
             </svg>
             ${repo.stargazers_count}
           </span>`
        : '';
      const forks = repo.forks_count > 0
        ? `<span class="repo-forks">
             <svg width="13" height="13" viewBox="0 0 16 16" fill="#57606a">
               <path d="M5 5.372v.878c0 .414.336.75.75.75h4.5a.75.75 0 0 0 .75-.75v-.878a2.25 2.25 0 1 1 1.5 0v.878a2.25 2.25 0 0 1-2.25 2.25h-1.5v2.128a2.251 2.251 0 1 1-1.5 0V8.5h-1.5A2.25 2.25 0 0 1 3.5 6.25v-.878a2.25 2.25 0 1 1 1.5 0ZM5 3.25a.75.75 0 1 0-1.5 0 .75.75 0 0 0 1.5 0Zm6.75.75a.75.75 0 1 0 0-1.5.75.75 0 0 0 0 1.5Zm-3 8.75a.75.75 0 1 0-1.5 0 .75.75 0 0 0 1.5 0Z"/>
             </svg>
             ${repo.forks_count}
           </span>`
        : '';
      const fork = repo.fork ? `<span class="repo-fork-badge">fork</span>` : '';
      return `
        <div class="repo-card">
          <div class="repo-info">
            <a class="repo-name" href="${repo.html_url}" target="_blank" rel="noopener">${repo.name}</a>
            ${desc}
            <div class="repo-meta">
              ${lang}${stars}${forks}${fork}
              <span class="repo-updated">Updated ${relativeTime(repo.pushed_at)}</span>
            </div>
          </div>
        </div>`;
    }

    /* ── Fetch all pages from GitHub API ── */
    let allRepos = [];

    async function fetchAllRepos() {
      const results = [];
      let page = 1;
      while (true) {
        const res = await fetch(
          `https://api.github.com/users/khinds-dev/repos?per_page=100&page=${page}`,
          { headers: { Accept: 'application/vnd.github+json' } }
        );
        if (!res.ok) throw new Error(`GitHub API ${res.status}`);
        const data = await res.json();
        results.push(...data);
        if (data.length < 100) break;
        page++;
      }
      return results;
    }

    function sortRepos(repos, sort) {
      const copy = [...repos];
      if (sort === 'stars')   copy.sort((a, b) => b.stargazers_count - a.stargazers_count);
      if (sort === 'updated') copy.sort((a, b) => new Date(b.pushed_at) - new Date(a.pushed_at));
      if (sort === 'name')    copy.sort((a, b) => a.name.localeCompare(b.name));
      return copy;
    }

    function render() {
      const query = document.getElementById('searchInput').value.trim().toLowerCase();
      const sort  = document.getElementById('sortSelect').value;
      const list  = document.getElementById('repo-list');
      const count = document.getElementById('repoCount');

      let repos = sortRepos(allRepos, sort);
      if (query) {
        repos = repos.filter(r =>
          r.name.toLowerCase().includes(query) ||
          (r.description && r.description.toLowerCase().includes(query))
        );
      }

      count.textContent = `${repos.length} repo${repos.length !== 1 ? 's' : ''}`;

      if (repos.length === 0) {
        list.innerHTML = `<p class="state-msg">No repositories match "${query}".</p>`;
        return;
      }
      list.innerHTML = repos.map(renderCard).join('');
    }

    (async () => {
      try {
        allRepos = await fetchAllRepos();
        document.getElementById('stateMsg').remove();
        render();
      } catch (err) {
        document.getElementById('stateMsg').textContent =
          'Could not load repositories. Please try again later.';
      }
    })();

    document.getElementById('searchInput').addEventListener('input', render);
    document.getElementById('sortSelect').addEventListener('change', render);
  </script>

</body>
</html>
