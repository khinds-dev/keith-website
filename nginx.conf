server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    error_page 404 /404.html;

    # Proxy all /api/* requests to the Node.js API container
    location /api/ {
        client_max_body_size 10m;
        proxy_pass         http://keith-api:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    # Serve 404 page directly (no redirect loop)
    location = /404.html {
        internal;
    }

    # Clean URLs: /portfolio, /contact, /blog, /blog/post, /admin → directory index.html
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }
}
