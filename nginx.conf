server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Collapse nginx's absolute trailing-slash redirects to relative ones so
    # Cloudflare serves them as HTTPS in a single hop (fixes PERF-01).
    absolute_redirect off;

    # Security headers (SEC-01 – SEC-05)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options            "SAMEORIGIN"                                  always;
    add_header X-Content-Type-Options     "nosniff"                                     always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin"             always;
    add_header Permissions-Policy         "camera=(), microphone=(), geolocation=()"    always;

    error_page 404 /404.html;

    # Proxy all /api/* requests to the Node.js API container
    location /api/ {
        client_max_body_size 10m;
        proxy_pass         http://keith-api:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    # Serve 404 page directly (no redirect loop)
    location = /404.html {
        internal;
    }

    # Clean URLs: /portfolio, /contact, /blog, /blog/post, /admin → directory index.html
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }
}
