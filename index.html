<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Keith's Homepage</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
      background: #f7f8fa;
      color: #1f2328;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .card {
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 3rem 2.5rem;
      max-width: 560px;
      width: 100%;
      text-align: center;
    }

    .avatar {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: #e5e7eb;
      margin: 0 auto 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
      color: #57606a;
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }

    .tagline {
      color: #57606a;
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 2rem;
    }

    .links {
      display: flex;
      gap: 0.75rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .links a {
      display: inline-block;
      padding: 0.5rem 1.25rem;
      border: 1px solid #e5e7eb;
      border-radius: 6px;
      text-decoration: none;
      color: #1f2328;
      font-size: 0.9rem;
      transition: border-color 0.15s, background 0.15s;
    }

    .links a:hover {
      border-color: #3b82d4;
      background: #f0f6ff;
      color: #3b82d4;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="avatar">👤</div>
    <h1>Keith</h1>
    <p class="tagline">
      <!-- TODO: Replace with your short bio -->
      Software enthusiast, tinkerer, and Synology homelab operator.<br />
      Welcome to my corner of the internet.
    </p>
    <nav class="links">
      <a href="https://github.com/YOUR_USERNAME" target="_blank" rel="noopener">GitHub</a>
      <a href="https://linkedin.com/in/YOUR_PROFILE" target="_blank" rel="noopener">LinkedIn</a>
      <!-- Add more links here -->
    </nav>
  </div>
</body>
</html>
