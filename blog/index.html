<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Writing — Keith Hinds</title>
  <meta name="description" content="Writing by Keith Hinds — software engineering, technology, aviation, and ideas." />
  <link rel="canonical" href="https://keithhinds.co.uk/blog" />
  <meta property="og:title" content="Writing — Keith Hinds" />
  <meta property="og:description" content="Writing by Keith Hinds — software engineering, technology, aviation, and ideas." />
  <meta property="og:url" content="https://keithhinds.co.uk/blog" />
  <meta property="og:image" content="https://keithhinds.co.uk/profile.jpg" />
  <meta property="og:type" content="website" />
  <link rel="stylesheet" href="/css/shared.css" />
  <style>
    .content {
      max-width: 960px;
      width: 100%;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 0.35rem;
    }

    .subtitle {
      font-size: 0.9rem;
      color: #57606a;
      margin-bottom: 0.4rem;
    }
    .subtitle:last-of-type {
      margin-bottom: 2.5rem;
    }

    /* ── Tile grid ── */
    .post-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.25rem;
    }

    .post-tile {
      display: flex;
      flex-direction: column;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      overflow: hidden;
      text-decoration: none;
      color: inherit;
      background: #ffffff;
      transition: border-color 0.12s;
    }

    .post-tile:hover { border-color: #1f2328; }

    .post-tile-image-wrap {
      position: relative;
      width: 100%;
      padding-top: 56.25%; /* 16:9 — matches admin crop box */
      overflow: hidden;
      background: #f7f8fa;
    }

    .post-tile-image {
      position: absolute;
      display: block;
      /* sized and positioned by JS to match admin cropper coordinates */
    }

    .post-tile-no-image {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #f7f8fa;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #c0c4cc;
    }

    .post-tile-no-image svg { opacity: 0.4; }

    .post-tile-body {
      padding: 1rem 1.1rem 1.1rem;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .post-tile-title {
      font-size: 0.95rem;
      font-weight: 600;
      color: #1f2328;
      line-height: 1.35;
    }

    .post-tile-excerpt {
      font-size: 0.82rem;
      color: #57606a;
      line-height: 1.55;
      flex: 1;
    }

    .post-tile-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      margin-top: auto;
      padding-top: 0.5rem;
    }

    .post-tile-date {
      font-size: 0.78rem;
      color: #57606a;
    }

    .post-tile-read-time {
      font-size: 0.78rem;
      color: #57606a;
    }

    @media (max-width: 560px) {
      main { padding: 2rem 1.25rem; }
      .navbar { padding: 0 1.25rem; }
    }
  </style>
</head>
<body>

  <nav class="navbar" aria-label="Site navigation">
    <a href="/" class="site-name">Keith Hinds</a>
    <div class="nav-links" id="navLinks">
      <a href="/">Home</a>
      <a href="/about">About</a>
      <a href="/work">Work</a>
      <a href="/blog" class="active">Writing</a>
      <a href="/contact">Contact</a>
    </div>
    <button class="hamburger" id="menuBtn" aria-label="Open navigation menu" aria-expanded="false">
      <span aria-hidden="true"></span><span aria-hidden="true"></span><span aria-hidden="true"></span>
    </button>
  </nav>

  <main>
    <div class="content">
      <h1>Writing</h1>
      <p class="subtitle">A place to explore software, technology, and the things I'm curious about.</p>
      <p class="subtitle">From engineering and developer tools to hobbies, experiences, ideas, and the occasional rabbit hole.</p>

      <div id="postList" class="post-grid">
        <div class="loading">Loading posts…</div>
      </div>
    </div>
  </main>

  <footer>&copy; <span id="yr"></span> Keith Hinds</footer>

  <script>
    document.getElementById('yr').textContent = new Date().getFullYear();

    var IMAGE_PLACEHOLDER =
      '<div class="post-tile-no-image">' +
        '<svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="#9ca3af" stroke-width="1.5">' +
          '<rect x="3" y="3" width="18" height="18" rx="2"/>' +
          '<circle cx="8.5" cy="8.5" r="1.5"/>' +
          '<path d="m21 15-5-5L5 21"/>' +
        '</svg>' +
      '</div>';

    // Load posts
    fetch('/api/posts')
      .then(function (r) { return r.json(); })
      .then(function (posts) {
        var container = document.getElementById('postList');
        if (!posts.length) {
          container.className = '';
          container.innerHTML = '<div class="empty-state">No posts yet. Check back soon.</div>';
          return;
        }
        container.innerHTML = posts.map(function (p) {
          var date = new Date(p.created_at).toLocaleDateString('en-GB', {
            day: 'numeric', month: 'short', year: 'numeric'
          });
          var imgHtml = p.cover_image
            ? (function () {
                var fx = (p.cover_focal_x != null) ? p.cover_focal_x : 50;
                var fy = (p.cover_focal_y != null) ? p.cover_focal_y : 50;
                var fz = (p.cover_zoom    != null) ? p.cover_zoom    : 1;
                return '<div class="post-tile-image-wrap"><img class="post-tile-image" src="' + escAttr(p.cover_image) + '" alt="" loading="lazy" data-fx="' + fx + '" data-fy="' + fy + '" data-fz="' + fz + '" /></div>';
              })()
            : IMAGE_PLACEHOLDER;
          var excerpt = p.excerpt || '';
          var readTime = p.read_time ? p.read_time + ' min read' : '1 min read';
          return '<a class="post-tile" href="/blog/post?slug=' + encodeURIComponent(p.slug) + '">' +
            imgHtml +
            '<div class="post-tile-body">' +
              '<div class="post-tile-title">' + escHtml(p.title) + '</div>' +
              (excerpt ? '<div class="post-tile-excerpt">' + escHtml(excerpt) + '</div>' : '') +
              '<div class="post-tile-footer">' +
                '<span class="post-tile-date">' + date + '</span>' +
                '<span class="post-tile-read-time">' + readTime + '</span>' +
              '</div>' +
            '</div>' +
            '</a>';
        }).join('');

        // Position each cover image to match admin cropper coordinates exactly:
        // fz=1 → image fits (contain) inside the wrap; fx/fy = crop-centre as % of image size
        container.querySelectorAll('.post-tile-image').forEach(function (img) {
          applyCoverPosition(img);
          img.addEventListener('load', function () { applyCoverPosition(img); });
        });
      })
      .catch(function () {
        var container = document.getElementById('postList');
        container.className = '';
        container.innerHTML = '<div class="empty-state">Could not load posts.</div>';
      });

    function applyCoverPosition(img) {
      var wrap = img.parentNode;
      var wrapW = wrap.offsetWidth;
      var wrapH = wrap.offsetHeight;
      var natW  = img.naturalWidth;
      var natH  = img.naturalHeight;
      if (!natW || !natH || !wrapW || !wrapH) return;
      var fx = parseFloat(img.dataset.fx);
      var fy = parseFloat(img.dataset.fy);
      var fz = parseFloat(img.dataset.fz);
      // baseW/baseH: image size at fz=1 (contain inside wrap — same baseline as admin cropper)
      var scale = Math.min(wrapW / natW, wrapH / natH);
      var baseW = natW * scale;
      var baseH = natH * scale;
      var imgW = baseW * fz;
      var imgH = baseH * fz;
      var imgLeft = wrapW / 2 - (fx / 100) * imgW;
      var imgTop  = wrapH / 2 - (fy / 100) * imgH;
      img.style.width  = imgW + 'px';
      img.style.height = imgH + 'px';
      img.style.left   = imgLeft + 'px';
      img.style.top    = imgTop  + 'px';
    }

    function deriveExcerpt(body, maxLen) {
      // Strip markdown syntax to get plain text, then truncate
      var text = body
        .replace(/```[\s\S]*?```/g, '')   // fenced code blocks
        .replace(/`[^`]+`/g, '')           // inline code
        .replace(/!\[[^\]]*\]\([^)]+\)/g, '') // images
        .replace(/\[([^\]]+)\]\([^)]+\)/g, '$1') // links → keep link text
        .replace(/^#{1,6}\s+/gm, '')       // headings
        .replace(/^\s*[-*]\s+/gm, '')      // list bullets
        .replace(/^\s*\d+\.\s+/gm, '')     // ordered list numbers
        .replace(/^>\s+/gm, '')            // blockquotes
        .replace(/\*\*(.+?)\*\*/g, '$1')  // bold
        .replace(/\*(.+?)\*/g, '$1')       // italic
        .replace(/\n+/g, ' ')              // newlines → spaces
        .trim();
      if (!text) return '';
      if (text.length <= maxLen) return text;
      return text.slice(0, maxLen).replace(/\s+\S*$/, '') + '…';
    }

    function calcReadTime(body) {
      var words = body.trim().split(/\s+/).filter(Boolean).length;
      var mins = Math.max(1, Math.round(words / 200));
      return mins + ' min read';
    }

    function escHtml(s) {
      return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }
    function escAttr(s) {
      return s.replace(/&/g,'&amp;').replace(/"/g,'&quot;');
    }
  </script>

  <script src="/js/nav.js"></script>

</body>
</html>
