<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Post — Keith Hinds</title>
  <meta name="description" content="A post on the Keith Hinds blog." />
  <link rel="canonical" href="https://keithhinds.co.uk/blog/post" />
  <meta property="og:title" content="Post — Keith Hinds" />
  <meta property="og:description" content="A post on the Keith Hinds blog." />
  <meta property="og:url" content="https://keithhinds.co.uk/blog/post" />
  <meta property="og:image" content="https://keithhinds.co.uk/profile.jpg" />
  <meta property="og:type" content="article" />
  <link rel="stylesheet" href="/css/shared.css" />
  <style>
    .content {
      max-width: 760px;
      width: 100%;
    }

    /* ── Post header ── */
    /* post-cover-wrap: height is set by JS to match exact cropped image height */
    .post-cover-wrap {
      position: relative;
      width: 100%;
      overflow: hidden;
      border-radius: 8px;
      border: 1px solid #e5e7eb;
      margin-bottom: 2rem;
    }

    .post-cover {
      position: absolute;
      display: block;
      /* sized and positioned by JS to match admin cropper coordinates */
    }

    .post-header {
      margin-bottom: 2rem;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid #e5e7eb;
    }

    .post-header h1 {
      font-size: 1.75rem;
      font-weight: 700;
      line-height: 1.25;
      margin-bottom: 0.5rem;
    }

    .post-meta {
      font-size: 0.82rem;
      color: #57606a;
    }


    /* ── Post body ── */
    .post-body {
      font-size: 0.95rem;
      line-height: 1.8;
      color: #1f2328;
    }

    .post-body p { margin-bottom: 1.25rem; }
    .post-body h2 { font-size: 1.15rem; margin: 2rem 0 0.75rem; }
    .post-body h3 { font-size: 1rem; margin: 1.5rem 0 0.5rem; }
    .post-body ul, .post-body ol { margin: 0.75rem 0 1.25rem 1.5rem; }
    .post-body li { margin-bottom: 0.35rem; }
    .post-body code {
      background: #f7f8fa;
      border: 1px solid #e5e7eb;
      border-radius: 4px;
      padding: 0.1em 0.35em;
      font-size: 0.88em;
      font-family: ui-monospace, "Cascadia Code", monospace;
    }
    .post-body pre {
      background: #f7f8fa;
      border: 1px solid #e5e7eb;
      border-radius: 6px;
      padding: 1rem;
      overflow-x: auto;
      margin-bottom: 1.25rem;
    }
    .post-body pre code {
      background: none;
      border: none;
      padding: 0;
      font-size: 0.875rem;
    }
    .post-body blockquote {
      border-left: 3px solid #e5e7eb;
      padding-left: 1rem;
      color: #57606a;
      margin: 1rem 0 1.25rem;
    }
    .post-body a { color: #0969da; }
    .post-body a:hover { text-decoration: none; }
    .post-inline-img {
      display: block;
      max-width: 100%;
      height: auto;
      border-radius: 6px;
      border: 1px solid #e5e7eb;
      margin: 0.5rem auto 1.25rem;
    }

    /* ── States ── */
    .error-state {
      padding: 3rem 0;
      text-align: center;
      color: #57606a;
      font-size: 0.9rem;
    }

    @media (max-width: 768px) {
      main { padding: 2rem 1.5rem; }
    }

    @media (max-width: 560px) {
      main { padding: 2rem 1.25rem; }
      .navbar { padding: 0 1.25rem; }
      .post-header h1 { font-size: 1.4rem; }
    }

    @media (max-width: 480px) {
      .post-header h1 { font-size: 1.25rem; }
      .post-body { font-size: 0.9rem; }
      .post-body pre { padding: 0.75rem; font-size: 0.82rem; }
      main { padding: 1.5rem 1rem; }
    }
  </style>
</head>
<body>

  <nav class="navbar" aria-label="Site navigation">
    <a href="/" class="site-name">Keith Hinds</a>
    <div class="nav-links" id="navLinks">
      <a href="/">Home</a>
      <a href="/about">About</a>
      <a href="/work">Work</a>
      <a href="/blog" class="active">Writing</a>
      <a href="/contact">Contact</a>
    </div>
    <button class="hamburger" id="menuBtn" aria-label="Open navigation menu" aria-expanded="false">
      <span aria-hidden="true"></span><span aria-hidden="true"></span><span aria-hidden="true"></span>
    </button>
  </nav>

  <main>
    <div class="content">
      <a href="/blog" class="back-link">
        <svg viewBox="0 0 16 16" width="14" height="14" fill="currentColor">
          <path d="M7.78 12.53a.75.75 0 0 1-1.06 0L2.47 8.28a.75.75 0 0 1 0-1.06l4.25-4.25a.751.751 0 0 1 1.042.018.751.751 0 0 1 .018 1.042L4.81 7h7.44a.75.75 0 0 1 0 1.5H4.81l2.97 2.97a.75.75 0 0 1 0 1.06z"/>
        </svg>
        Back to blog
      </a>

      <div id="postContent">
        <div class="error-state">Loading…</div>
      </div>
    </div>
  </main>

  <footer>&copy; <span id="yr"></span> Keith Hinds</footer>

  <script src="/js/nav.js"></script>
  <script>
    document.getElementById('yr').textContent = new Date().getFullYear();

    // Markdown renderer — paragraphs, headings (with IDs), code, bold, italic, lists, images, links
    function renderMarkdown(md) {
      // Step 1: extract fenced code blocks before HTML-escaping to preserve content
      var codeBlocks = [];
      var src = md.replace(/```([^\n]*)\n([\s\S]*?)```/g, function (_, lang, code) {
        var escaped = code
          .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        codeBlocks.push('<pre><code>' + escaped + '</code></pre>');
        return '\x00CODE' + (codeBlocks.length - 1) + '\x00';
      });

      // Step 2: HTML-escape everything else
      src = src
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

      // Step 3: inline spans (order matters)
      src = src
        // Headings — add slug IDs for anchor links
        .replace(/^###### (.+)$/gm, function(_, t) { return '<h6 id="' + slugId(t) + '">' + t + '</h6>'; })
        .replace(/^##### (.+)$/gm,  function(_, t) { return '<h5 id="' + slugId(t) + '">' + t + '</h5>'; })
        .replace(/^#### (.+)$/gm,   function(_, t) { return '<h4 id="' + slugId(t) + '">' + t + '</h4>'; })
        .replace(/^### (.+)$/gm,    function(_, t) { return '<h3 id="' + slugId(t) + '">' + t + '</h3>'; })
        .replace(/^## (.+)$/gm,     function(_, t) { return '<h2 id="' + slugId(t) + '">' + t + '</h2>'; })
        .replace(/^# (.+)$/gm,      function(_, t) { return '<h1 id="' + slugId(t) + '">' + t + '</h1>'; })
        // Bold & italic
        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
        .replace(/\*(.+?)\*/g, '<em>$1</em>')
        // Inline code
        .replace(/`([^`]+)`/g, '<code>$1</code>')
        // Blockquote (after HTML escape, > becomes &gt;)
        .replace(/^&gt; (.+)$/gm, '<blockquote>$1</blockquote>')
        // Images (before links — both use [] syntax)
        .replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<img src="$2" alt="$1" class="post-inline-img" />')
        // Links
        .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');

      // Step 4: lists — collect consecutive list lines then wrap in <ul> / <ol>
      src = src
        .replace(/((?:^[ \t]*[-*][ \t].+\n?)+)/gm, function(block) {
          var items = block.trim().split('\n').map(function(line) {
            return '<li>' + line.replace(/^[ \t]*[-*][ \t]/, '').trim() + '</li>';
          }).join('');
          return '<ul>' + items + '</ul>';
        })
        .replace(/((?:^[ \t]*\d+\.[ \t].+\n?)+)/gm, function(block) {
          var items = block.trim().split('\n').map(function(line) {
            return '<li>' + line.replace(/^[ \t]*\d+\.[ \t]/, '').trim() + '</li>';
          }).join('');
          return '<ol>' + items + '</ol>';
        });

      // Step 5: paragraphs — split on blank lines; skip lines that are already block elements
      var blocks = src.split(/\n{2,}/);
      src = blocks.map(function(block) {
        block = block.trim();
        if (!block) return '';
        if (/^\x00CODE\d+\x00$/.test(block)) return block;
        if (/^<(h[1-6]|ul|ol|pre|blockquote|img|p)[\s>]/.test(block)) return block;
        return '<p>' + block.replace(/\n/g, ' ') + '</p>';
      }).join('\n');

      // Step 6: restore code blocks
      src = src.replace(/\x00CODE(\d+)\x00/g, function(_, i) { return codeBlocks[+i]; });

      return src;
    }

    function slugId(text) {
      return text.toLowerCase()
        .replace(/[^a-z0-9\s-]/g, '')
        .trim()
        .replace(/\s+/g, '-');
    }

    function deriveExcerpt(body, maxLen) {
      var text = body
        .replace(/```[\s\S]*?```/g, '')
        .replace(/`[^`]+`/g, '')
        .replace(/!\[[^\]]*\]\([^)]+\)/g, '')
        .replace(/\[([^\]]+)\]\([^)]+\)/g, '$1')
        .replace(/^#{1,6}\s+/gm, '')
        .replace(/^\s*[-*]\s+/gm, '')
        .replace(/^\s*\d+\.\s+/gm, '')
        .replace(/^>\s+/gm, '')
        .replace(/\*\*(.+?)\*\*/g, '$1')
        .replace(/\*(.+?)\*/g, '$1')
        .replace(/\n+/g, ' ')
        .trim();
      if (!text) return '';
      if (text.length <= maxLen) return text;
      return text.slice(0, maxLen).replace(/\s+\S*$/, '') + '…';
    }

    // Read slug from query string
    var params = new URLSearchParams(window.location.search);
    var slug = params.get('slug');

    if (!slug) {
      document.getElementById('postContent').innerHTML =
        '<div class="error-state">No post specified.</div>';
    } else {
      fetch('/api/posts/' + encodeURIComponent(slug))
        .then(function (r) {
          if (!r.ok) throw new Error('not found');
          return r.json();
        })
        .then(function (post) {
          document.title = post.title + ' — Writing — Keith Hinds';
          // Update OG meta tags dynamically
          var setMeta = function(prop, val) {
            var el = document.querySelector('meta[property="' + prop + '"]');
            if (el) el.setAttribute('content', val);
          };
          setMeta('og:title', post.title + ' — Keith Hinds');
          setMeta('og:description', deriveExcerpt(post.body || '', 200) || document.querySelector('meta[name="description"]').getAttribute('content'));
          setMeta('og:url', 'https://keithhinds.co.uk/blog/post?slug=' + encodeURIComponent(post.slug));
          if (post.cover_image) setMeta('og:image', 'https://keithhinds.co.uk' + post.cover_image);
          var date = new Date(post.created_at).toLocaleDateString('en-GB', {
            day: 'numeric', month: 'long', year: 'numeric'
          });
          var fx = (post.cover_focal_x != null) ? post.cover_focal_x : 50;
          var fy = (post.cover_focal_y != null) ? post.cover_focal_y : 50;
          var fz = (post.cover_zoom    != null) ? post.cover_zoom    : 1;
          var coverHtml = post.cover_image
            ? '<div class="post-cover-wrap"><img class="post-cover" src="' + escAttr(post.cover_image) + '" alt="" data-fx="' + fx + '" data-fy="' + fy + '" data-fz="' + fz + '" /></div>'
            : '';
          document.getElementById('postContent').innerHTML =
            coverHtml +
            '<div class="post-header">' +
              '<h1>' + escHtml(post.title) + '</h1>' +
              '<div class="post-meta">' + date + '</div>' +
            '</div>' +
            '<div class="post-body">' + renderMarkdown(post.body) + '</div>';

          if (post.cover_image) {
            var img = document.querySelector('.post-cover');
            applyCoverPosition(img);
            img.addEventListener('load', function () { applyCoverPosition(img); });
            window.addEventListener('resize', function () { applyCoverPosition(img); });
          }
        })
        .catch(function () {
          document.getElementById('postContent').innerHTML =
            '<div class="error-state">Post not found.</div>';
        });
    }

    function applyCoverPosition(img) {
      var wrap = img.parentNode;
      // Reset any previously set inline width so we measure the column's natural width
      wrap.style.width = '';
      var wrapW = wrap.offsetWidth;
      var natW  = img.naturalWidth;
      var natH  = img.naturalHeight;
      if (!natW || !natH || !wrapW) return;
      var fx = parseFloat(img.dataset.fx);
      var fy = parseFloat(img.dataset.fy);
      var fz = parseFloat(img.dataset.fz);

      // Replicate admin crop box: 16:9 at current wrap width
      var CROP_RATIO = 16 / 9;
      var cropW = wrapW;
      var cropH = Math.round(cropW / CROP_RATIO);

      // scaleToFit: same as admin — contain the image inside the crop box at fz=1
      var scaleToFit = Math.min(cropW / natW, cropH / natH);
      var imgW = natW * scaleToFit * fz;
      var imgH = natH * scaleToFit * fz;

      // Image top-left relative to crop box top-left (crop box origin = wrap origin)
      var imgLeft = cropW / 2 - (fx / 100) * imgW;
      var imgTop  = cropH / 2 - (fy / 100) * imgH;

      // Visible image region within the crop box (clip to intersection of image and crop box)
      var visLeft   = Math.max(0, imgLeft);
      var visRight  = Math.min(cropW, imgLeft + imgW);
      var visTop    = Math.max(0, imgTop);
      var visBottom = Math.min(cropH, imgTop + imgH);
      var visWidth  = Math.max(0, visRight  - visLeft);
      var visHeight = Math.max(0, visBottom - visTop);

      // Size the wrap to exactly the visible image region — no empty space on any edge.
      // Centre the wrap within the content column so layout remains balanced.
      wrap.style.width  = visWidth  + 'px';
      wrap.style.height = visHeight + 'px';
      wrap.style.marginLeft  = 'auto';
      wrap.style.marginRight = 'auto';

      // Offset the image so the visible region's top-left maps to (0, 0) in the wrap
      img.style.width  = imgW + 'px';
      img.style.height = imgH + 'px';
      img.style.left   = (imgLeft - visLeft) + 'px';
      img.style.top    = (imgTop  - visTop)  + 'px';
    }

    function escHtml(s) {
      return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }
    function escAttr(s) {
      return s.replace(/&/g,'&amp;').replace(/"/g,'&quot;');
    }
  </script>

</body>
</html>
