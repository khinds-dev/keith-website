<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Post — Keith Hinds</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
      background: #ffffff;
      color: #1f2328;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Nav bar ── */
    .navbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 2rem;
      height: 52px;
      border-bottom: 1px solid #e5e7eb;
      position: relative;
    }

    .navbar .site-name {
      font-weight: 600;
      font-size: 0.95rem;
      color: #1f2328;
      text-decoration: none;
      flex-shrink: 0;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 0.25rem;
    }

    .nav-links a {
      font-size: 0.88rem;
      color: #57606a;
      text-decoration: none;
      padding: 0.35rem 0.65rem;
      border-radius: 6px;
      transition: background 0.12s, color 0.12s;
      white-space: nowrap;
    }

    .nav-links a:hover { background: #f7f8fa; color: #1f2328; }
    .nav-links a.active { font-weight: 600; color: #1f2328; }

    /* Hamburger — mobile only */
    .hamburger {
      display: none;
      background: none;
      border: 1px solid #e5e7eb;
      border-radius: 5px;
      cursor: pointer;
      padding: 0.4rem 0.5rem;
      flex-direction: column;
      gap: 4px;
      z-index: 200;
    }

    .hamburger span {
      display: block;
      width: 20px;
      height: 2px;
      background: #1f2328;
      border-radius: 2px;
      transition: transform 0.2s, opacity 0.2s;
    }

    .hamburger.open span:nth-child(1) { transform: translateY(6px) rotate(45deg); }
    .hamburger.open span:nth-child(2) { opacity: 0; }
    .hamburger.open span:nth-child(3) { transform: translateY(-6px) rotate(-45deg); }

    @media (max-width: 640px) {
      .hamburger { display: flex; }
      .nav-links {
        display: none;
        position: absolute;
        top: 52px;
        left: 0;
        right: 0;
        background: #ffffff;
        border-bottom: 1px solid #e5e7eb;
        flex-direction: column;
        padding: 0.5rem 0;
        z-index: 100;
      }
      .nav-links.open { display: flex; }
      .nav-links a {
        padding: 0.75rem 2rem;
        border-radius: 0;
        border-bottom: 1px solid #f0f1f3;
      }
      .nav-links a:last-child { border-bottom: none; }
    }

    /* ── Main ── */
    main {
      flex: 1;
      display: flex;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .content {
      max-width: 760px;
      width: 100%;
    }

    /* ── Back link ── */
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      font-size: 0.85rem;
      color: #57606a;
      text-decoration: none;
      margin-bottom: 2rem;
      transition: color 0.12s;
    }

    .back-link:hover { color: #1f2328; }

    /* ── Post header ── */
    /* post-cover-wrap: height is set by JS to match exact cropped image height */
    .post-cover-wrap {
      position: relative;
      width: 100%;
      overflow: hidden;
      border-radius: 8px;
      border: 1px solid #e5e7eb;
      margin-bottom: 2rem;
    }

    .post-cover {
      position: absolute;
      display: block;
      /* sized and positioned by JS to match admin cropper coordinates */
    }

    .post-header {
      margin-bottom: 2rem;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid #e5e7eb;
    }

    .post-header h1 {
      font-size: 1.75rem;
      font-weight: 700;
      line-height: 1.25;
      margin-bottom: 0.5rem;
    }

    .post-meta {
      font-size: 0.82rem;
      color: #57606a;
    }


    /* ── Post body ── */
    .post-body {
      font-size: 0.95rem;
      line-height: 1.8;
      color: #1f2328;
    }

    .post-body p { margin-bottom: 1.25rem; }
    .post-body h2 { font-size: 1.15rem; margin: 2rem 0 0.75rem; }
    .post-body h3 { font-size: 1rem; margin: 1.5rem 0 0.5rem; }
    .post-body ul, .post-body ol { margin: 0.75rem 0 1.25rem 1.5rem; }
    .post-body li { margin-bottom: 0.35rem; }
    .post-body code {
      background: #f7f8fa;
      border: 1px solid #e5e7eb;
      border-radius: 4px;
      padding: 0.1em 0.35em;
      font-size: 0.88em;
      font-family: ui-monospace, "Cascadia Code", monospace;
    }
    .post-body pre {
      background: #f7f8fa;
      border: 1px solid #e5e7eb;
      border-radius: 6px;
      padding: 1rem;
      overflow-x: auto;
      margin-bottom: 1.25rem;
    }
    .post-body pre code {
      background: none;
      border: none;
      padding: 0;
      font-size: 0.875rem;
    }
    .post-body blockquote {
      border-left: 3px solid #e5e7eb;
      padding-left: 1rem;
      color: #57606a;
      margin: 1rem 0 1.25rem;
    }
    .post-body a { color: #0969da; }
    .post-body a:hover { text-decoration: none; }
    .post-inline-img {
      display: block;
      max-width: 100%;
      height: auto;
      border-radius: 6px;
      border: 1px solid #e5e7eb;
      margin: 0.5rem auto 1.25rem;
    }

    /* ── States ── */
    .error-state {
      padding: 3rem 0;
      text-align: center;
      color: #57606a;
      font-size: 0.9rem;
    }

    /* ── Footer ── */
    footer {
      padding: 1.5rem 2rem;
      text-align: center;
      font-size: 0.8rem;
      color: #57606a;
      border-top: 1px solid #e5e7eb;
    }

    @media (max-width: 560px) {
      main { padding: 2rem 1.25rem; }
      .navbar { padding: 0.75rem 1.25rem; }
      .post-header h1 { font-size: 1.4rem; }
    }
  </style>
</head>
<body>

  <nav class="navbar">
    <a href="/" class="site-name">Keith Hinds</a>
    <div class="nav-links" id="navLinks">
      <a href="/">Home</a>
      <a href="/portfolio">Portfolio</a>
      <a href="/repos">Repos</a>
      <a href="/blog" class="active">Blog</a>
      <a href="/contact">Contact</a>
    </div>
    <button class="hamburger" id="menuBtn" aria-label="Open navigation menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
  </nav>

  <main>
    <div class="content">
      <a href="/blog" class="back-link">
        <svg viewBox="0 0 16 16" width="14" height="14" fill="currentColor">
          <path d="M7.78 12.53a.75.75 0 0 1-1.06 0L2.47 8.28a.75.75 0 0 1 0-1.06l4.25-4.25a.751.751 0 0 1 1.042.018.751.751 0 0 1 .018 1.042L4.81 7h7.44a.75.75 0 0 1 0 1.5H4.81l2.97 2.97a.75.75 0 0 1 0 1.06z"/>
        </svg>
        Back to blog
      </a>

      <div id="postContent">
        <div class="error-state">Loading…</div>
      </div>
    </div>
  </main>

  <footer>&copy; <span id="yr"></span> Keith Hinds</footer>

  <script>
    document.getElementById('yr').textContent = new Date().getFullYear();

    // Nav toggle
    const btn = document.getElementById('menuBtn');
    const menu = document.getElementById('navLinks');
    btn.addEventListener('click', function () {
      const isOpen = menu.classList.toggle('open');
      btn.classList.toggle('open', isOpen);
      btn.setAttribute('aria-expanded', isOpen);
    });
    document.addEventListener('click', function (e) {
      if (!btn.contains(e.target) && !menu.contains(e.target)) {
        menu.classList.remove('open');
        btn.classList.remove('open');
        btn.setAttribute('aria-expanded', false);
      }
    });

    // Simple Markdown-ish renderer (paragraphs, headings, code, bold, italic, lists)
    function renderMarkdown(md) {
      var html = md
        // Escape HTML first
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        // Fenced code blocks
        .replace(/```[\s\S]*?```/g, function (m) {
          var inner = m.slice(3, -3).replace(/^\w*\n/, '');
          return '<pre><code>' + inner + '</code></pre>';
        })
        // Headings
        .replace(/^### (.+)$/gm, '<h3>$1</h3>')
        .replace(/^## (.+)$/gm, '<h2>$1</h2>')
        // Bold & italic
        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
        .replace(/\*(.+?)\*/g, '<em>$1</em>')
        // Inline code
        .replace(/`([^`]+)`/g, '<code>$1</code>')
        // Blockquote
        .replace(/^&gt; (.+)$/gm, '<blockquote>$1</blockquote>')
        // Unordered list items
        .replace(/^\s*[-*] (.+)$/gm, '<li>$1</li>')
        // Wrap consecutive <li> in <ul>
        .replace(/(<li>[\s\S]*?<\/li>)(?!\s*<li>)/g, '<ul>$1</ul>')
        // Images (must come before links)
        .replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<img src="$2" alt="$1" class="post-inline-img" />')
        // Links
        .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>')
        // Paragraphs (lines not already block elements)
        .split(/\n{2,}/)
        .map(function (block) {
          block = block.trim();
          if (!block) return '';
          if (/^<(h[1-6]|ul|ol|li|pre|blockquote|img)/.test(block)) return block;
          return '<p>' + block.replace(/\n/g, ' ') + '</p>';
        })
        .join('\n');
      return html;
    }

    // Read slug from query string
    var params = new URLSearchParams(window.location.search);
    var slug = params.get('slug');

    if (!slug) {
      document.getElementById('postContent').innerHTML =
        '<div class="error-state">No post specified.</div>';
    } else {
      fetch('/api/posts/' + encodeURIComponent(slug))
        .then(function (r) {
          if (!r.ok) throw new Error('not found');
          return r.json();
        })
        .then(function (post) {
          document.title = post.title + ' — Keith Hinds';
          var date = new Date(post.created_at).toLocaleDateString('en-GB', {
            day: 'numeric', month: 'long', year: 'numeric'
          });
          var fx = (post.cover_focal_x != null) ? post.cover_focal_x : 50;
          var fy = (post.cover_focal_y != null) ? post.cover_focal_y : 50;
          var fz = (post.cover_zoom    != null) ? post.cover_zoom    : 1;
          var coverHtml = post.cover_image
            ? '<div class="post-cover-wrap"><img class="post-cover" src="' + escAttr(post.cover_image) + '" alt="" data-fx="' + fx + '" data-fy="' + fy + '" data-fz="' + fz + '" /></div>'
            : '';
          document.getElementById('postContent').innerHTML =
            coverHtml +
            '<div class="post-header">' +
              '<h1>' + escHtml(post.title) + '</h1>' +
              '<div class="post-meta">' + date + '</div>' +
            '</div>' +
            '<div class="post-body">' + renderMarkdown(post.body) + '</div>';

          if (post.cover_image) {
            var img = document.querySelector('.post-cover');
            applyCoverPosition(img);
            img.addEventListener('load', function () { applyCoverPosition(img); });
            window.addEventListener('resize', function () { applyCoverPosition(img); });
          }
        })
        .catch(function () {
          document.getElementById('postContent').innerHTML =
            '<div class="error-state">Post not found.</div>';
        });
    }

    function applyCoverPosition(img) {
      var wrap = img.parentNode;
      // Reset any previously set inline width so we measure the column's natural width
      wrap.style.width = '';
      var wrapW = wrap.offsetWidth;
      var natW  = img.naturalWidth;
      var natH  = img.naturalHeight;
      if (!natW || !natH || !wrapW) return;
      var fx = parseFloat(img.dataset.fx);
      var fy = parseFloat(img.dataset.fy);
      var fz = parseFloat(img.dataset.fz);

      // Replicate admin crop box: 16:9 at current wrap width
      var CROP_RATIO = 16 / 9;
      var cropW = wrapW;
      var cropH = Math.round(cropW / CROP_RATIO);

      // scaleToFit: same as admin — contain the image inside the crop box at fz=1
      var scaleToFit = Math.min(cropW / natW, cropH / natH);
      var imgW = natW * scaleToFit * fz;
      var imgH = natH * scaleToFit * fz;

      // Image top-left relative to crop box top-left (crop box origin = wrap origin)
      var imgLeft = cropW / 2 - (fx / 100) * imgW;
      var imgTop  = cropH / 2 - (fy / 100) * imgH;

      // Visible image region within the crop box (clip to intersection of image and crop box)
      var visLeft   = Math.max(0, imgLeft);
      var visRight  = Math.min(cropW, imgLeft + imgW);
      var visTop    = Math.max(0, imgTop);
      var visBottom = Math.min(cropH, imgTop + imgH);
      var visWidth  = Math.max(0, visRight  - visLeft);
      var visHeight = Math.max(0, visBottom - visTop);

      // Size the wrap to exactly the visible image region — no empty space on any edge.
      // Centre the wrap within the content column so layout remains balanced.
      wrap.style.width  = visWidth  + 'px';
      wrap.style.height = visHeight + 'px';
      wrap.style.marginLeft  = 'auto';
      wrap.style.marginRight = 'auto';

      // Offset the image so the visible region's top-left maps to (0, 0) in the wrap
      img.style.width  = imgW + 'px';
      img.style.height = imgH + 'px';
      img.style.left   = (imgLeft - visLeft) + 'px';
      img.style.top    = (imgTop  - visTop)  + 'px';
    }

    function escHtml(s) {
      return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }
    function escAttr(s) {
      return s.replace(/&/g,'&amp;').replace(/"/g,'&quot;');
    }
  </script>

</body>
</html>
